[project]
name = "pg-essays-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JaganMurugan", email = "jaganmurugan.m@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.2.0",
    "pinecone>=10.3.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
pg-essays-agent = "pg_essays_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
